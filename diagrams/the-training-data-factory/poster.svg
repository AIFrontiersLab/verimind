<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<rect width="100%" height="100%" fill="#FAF7F0"/>
<text x="56" y="64" fill="#1A4BFF" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">AI FRONTIERS FORUM</text>
<text x="56" y="120" fill="#0B1F3A" font-size="42" font-family="Arial, Helvetica, sans-serif" font-weight="700">The Training Data Factory</text>
<text x="56" y="168" fill="#5A6B7D" font-size="22" font-family="Arial, Helvetica, sans-serif">One concept. Three AI perspectives. One tested architecture.</text>
<rect x="48.0" y="280.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="68.0" y="320.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Lexical Search Engine</text>
<text x="68.0" y="358.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Performs keyword-based retrieval to</text>
<text x="68.0" y="384.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">identify exact matches in the</text>
<text x="68.0" y="410.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">dataset.</text>
<rect x="524.0" y="280.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="544.0" y="320.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Dense Retrieval Model</text>
<text x="544.0" y="358.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Uses embeddings to find semantically</text>
<text x="544.0" y="384.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">similar documents and paraphrases.</text>
<rect x="48.0" y="524.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="68.0" y="564.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Score Fusion Module</text>
<text x="68.0" y="602.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Combines results from lexical and</text>
<text x="68.0" y="628.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">dense retrieval, applying diversity</text>
<text x="68.0" y="654.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">controls to prevent redundancy.</text>
<rect x="524.0" y="524.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="544.0" y="564.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Audit Trail System</text>
<text x="544.0" y="602.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Tracks data transformations and</text>
<text x="544.0" y="628.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">retrieval decisions to ensure</text>
<text x="544.0" y="654.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">transparency and compliance.</text>
<text x="56" y="1496" fill="#5A6B7D" font-size="16" font-family="Arial, Helvetica, sans-serif">For more AI learning, register free:  https://aifrontiersforum.org/join</text>
</svg>
